[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-llm-hub"
version = "1.0.0"
description = "Enterprise Generative AI & LLM Architecture Reference Hub"
authors = [{ name = "Mohamed Salman", email = "msalem@tridecal.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]